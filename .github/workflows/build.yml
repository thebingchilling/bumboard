name: Build BumBoard

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch: {}

concurrency:
  group: bumboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BUILD_VERSION_NAME: 0.1.0-dev.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends librime-bin librime-dev libopencc-data
          pip install --quiet opencc

      - name: Fetch prebuilt librime
        run: scripts/fetch-prebuilt.sh

      - uses: actions/cache@v4
        with:
          path: data/.cache
          key: bumboard-sources-${{ hashFiles('data/sources.json', 'data/emoji_sources.json') }}

      - name: Build dictionary data
        run: python3 data/build_data.py --opencc prebuilt/opencc/data

      - name: Build emoji data
        run: python3 data/build_emoji.py

      - name: Rime schema tests (host librime)
        run: data/test/run.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.1.0 ndk;28.0.13004108 cmake;3.31.6

      - uses: gradle/actions/setup-gradle@v4

      - name: Core unit tests
        run: ./gradlew --no-daemon :core:test

      - name: Build debug APK
        run: ./gradlew --no-daemon :latinime:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: bumboard-${{ env.BUILD_VERSION_NAME }}
          path: latinime/build/outputs/apk/debug/*.apk
          if-no-files-found: error
