name: Build Lychee

# Builds only when the app itself changes: everything that goes into the APK lives in app/
# (docs, pack builders in packs/ and the packs workflow don't start a build), or by hand.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      release:
        type: boolean
        description: "Publish a release (pushes to main always do; a debug release on this private repo)"
        default: false

permissions:
  contents: write

concurrency:
  group: lychee-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BUILD_VERSION_NAME: 0.1.0-dev.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends librime-bin librime-dev libopencc-data
          pip install --quiet opencc fonttools

      - name: Fetch prebuilt librime
        run: scripts/fetch-prebuilt.sh

      - uses: actions/cache@v4
        with:
          path: app/data/.cache
          key: lychee-sources-${{ hashFiles('app/data/sources.json', 'app/data/emoji_sources.json') }}

      - name: Build dictionary data
        run: python3 data/build_data.py --opencc prebuilt/opencc/data

      - name: Build emoji data
        run: python3 data/build_emoji.py

      # after the data builds: build_data.py starts by clearing data/out
      - name: Fetch the handwriting models (PP-OCRv5)
        run: scripts/fetch-ocr.sh

      - name: Fetch Google Sans Flex (interface font)
        run: scripts/fetch-fonts.sh

      # the Japanese, Korean and English dictionaries, stroke order and examples come with the
      # app (the newest published packs); only fonts are downloads
      - name: Bundle the packs that come with Lychee
        run: python3 scripts/bundle-packs.py data/out/assets/lychee/bundled

      - name: Rime schema tests (host librime)
        run: data/test/run.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.1.0 ndk;28.0.13004108 cmake;3.31.6

      - uses: gradle/actions/setup-gradle@v4

      - name: Core unit tests
        run: ./gradlew --no-daemon :core:test

      - name: Build debug APK
        run: ./gradlew --no-daemon :latinime:assembleDebug

      - name: APK size
        run: |
          apk=$(ls latinime/build/outputs/apk/debug/*.apk | head -1)
          {
            echo "### APK: $(du -h "$apk" | cut -f1)"
            echo '```'
            unzip -lv "$apk" | awk 'NR>3 && $8 != "" && $1 ~ /^[0-9]+$/ {printf "%9.1f MB  %9.1f MB  %s\n", $1/1048576, $3/1048576, $8}' | sort -k3 -rn | head -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: No network permissions
        run: |
          apk=$(ls latinime/build/outputs/apk/debug/*.apk | head -1)
          perms=$("$ANDROID_HOME"/build-tools/36.1.0/aapt2 dump permissions "$apk")
          echo "$perms"
          if echo "$perms" | grep -E 'android.permission.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE|CHANGE_NETWORK_STATE)'; then
            echo "::error::Lychee must never hold a network permission"
            exit 1
          fi

      # Each build on main is a debug release (a full release, not a pre-release) of this
      # private repository with its APK, like Quartz's releases, instead of an artifact
      - name: Publish the build as a debug release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="lychee-$BUILD_VERSION_NAME"
          mkdir -p dist
          cp "$(ls latinime/build/outputs/apk/debug/*.apk | head -1)" "dist/$tag.apk"
          git log -1 --format=%B "$GITHUB_SHA" | grep -vE '^(Co-Authored-By|Claude-Session):' > notes.md
          printf '\nDebug-signed test build (the fixed debug key, so it installs over the last one).\n' >> notes.md
          gh release create "$tag" "dist/$tag.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Lychee ${BUILD_VERSION_NAME#0.1.0-} (debug)" \
            --latest \
            --notes-file notes.md
