name: Build Lychee packs

# The optional downloads the app's catalogue (latinime/bumboard/assets/bumboard/packs.json)
# links to: built (or, for fonts, mirrored) here and published on the public lychee repository's
# "packs" release. The app has no network access: the browser downloads these, and opening the
# downloaded file installs it.
on:
  workflow_dispatch: {}
  push:
    branches: [main, 'claude/**']
    paths:
      - 'data/packs/**'
      - '.github/workflows/packs.yml'
      - 'latinime/bumboard/assets/bumboard/packs.json'

permissions:
  contents: write

concurrency:
  group: bumboard-packs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packs:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends librime-bin zip zinnia-utils || \
            sudo apt-get install -y -q --no-install-recommends librime-bin zip

      - uses: actions/cache@v4
        with:
          path: data/packs/ja/.cache
          key: bumboard-mozc-dict-v1

      - name: Japanese dictionary pack
        run: python3 data/packs/ja/build_ja.py --out out/packs

      - name: Handwriting packs
        run: data/packs/handwriting/build_hw.sh out/packs

      - name: Font and emoji packs (one-tap mirrors of the fonts' latest releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 data/packs/fonts/mirror_fonts.py --out out/packs

      - uses: actions/upload-artifact@v4
        with:
          name: lychee-packs
          path: out/packs/lychee-*.zip
          if-no-files-found: error

      # Public: the packs go to the "packs" release of thebingchilling/lychee (a pre-release,
      # so it never shows as the app's latest release), uploaded with the owner's token
      # (the PACKS_TOKEN secret), so they appear as the owner's. Only the pack zips go there.
      - name: Publish to lychee's "packs" release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.PACKS_TOKEN }}
          REPO: thebingchilling/lychee
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::PACKS_TOKEN is not set; the packs were built but not published"
            exit 0
          fi
          # nothing but the pack zips is ever uploaded
          ls out/packs/lychee-*.zip
          if ! gh release view packs --repo "$REPO" >/dev/null 2>&1; then
            gh release create packs --repo "$REPO" --prerelease --title "Lychee packs" \
              --notes "Optional downloads for the Lychee keyboard: handwriting, dictionaries and fonts. In Lychee, open Settings > Downloads and tap Download; when your browser has saved the file, tap Open. All packs are free and openly licensed; each zip includes its licence."
          fi
          gh release upload packs out/packs/lychee-*.zip --repo "$REPO" --clobber
