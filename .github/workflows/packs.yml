name: Build Lychee packs

# The optional downloads the app's catalogue (app/latinime/lychee/assets/lychee/packs.json)
# links to: built (or, for fonts, mirrored) here from their sources' newest data and published
# on the public lychee repository's "packs" release. The app has no network access: the browser
# downloads these, and opening the downloaded file installs it.
#
# Only when started by hand (Actions > Build Lychee packs > Run workflow): the packs are
# rebuilt; only packs whose contents changed get a new version and are uploaded
# (packs/publish.py), and manifest.json, which the packs page uses to tell Lychee users
# about updates, is refreshed. Nothing runs on a schedule or on pushes, to save Actions minutes.
on:
  workflow_dispatch:
    inputs:
      handwriting_minutes:
        description: "Train the handwriting recogniser this many more minutes first (0: publish it as it is; at most 340). Training normally runs on Kaggle (packs/handwriting/kaggle.py), not here: it uses Actions minutes"
        type: number
        default: 0

permissions:
  contents: write

concurrency:
  group: lychee-packs-${{ github.ref }}
  # a publishing run always finishes
  cancel-in-progress: false

jobs:
  # Lychee's handwriting recogniser (packs/handwriting): training carries on from the last
  # checkpoint, kept on this private repository's "handwriting-training" pre-release (never
  # public; only the finished pack goes to lychee), for as long as asked, then the model is
  # exported as the handwriting pack for the packs job below.
  handwriting:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      MINUTES: ${{ inputs.handwriting_minutes || 0 }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the training tools
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet numpy onnx onnxruntime pyarrow
          echo "$(nproc) CPUs"

      - name: The last checkpoint
        run: |
          mkdir -p packs/handwriting/out
          gh release download handwriting-training --repo "$GITHUB_REPOSITORY" --pattern checkpoint.pt \
            --dir packs/handwriting/out || echo "no checkpoint yet"

      - name: Train
        if: env.MINUTES != '0'
        run: |
          m=$(( MINUTES > 340 ? 340 : MINUTES ))
          python3 packs/handwriting/train.py --minutes "$m" --checkpoint packs/handwriting/out/checkpoint.pt

      - name: Keep the checkpoint
        if: env.MINUTES != '0' && github.ref == 'refs/heads/main'
        run: |
          if ! gh release view handwriting-training --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create handwriting-training --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --title "Handwriting training" --notes "The handwriting recogniser's training checkpoint (packs.yml carries on from it)."
          fi
          gh release upload handwriting-training packs/handwriting/out/checkpoint.pt --repo "$GITHUB_REPOSITORY" --clobber

      - name: Export the handwriting pack
        run: |
          if [ -f packs/handwriting/out/checkpoint.pt ]; then
            python3 packs/handwriting/export.py --checkpoint packs/handwriting/out/checkpoint.pt --out out/packs
          else
            echo "::warning::no handwriting model trained yet; run with handwriting_minutes"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: lychee-handwriting
          path: out/packs/lychee-handwriting.zip
          if-no-files-found: ignore
          retention-days: 1

  packs:
    needs: handwriting
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      REPO: lychee-keyboard/lychee
      RELEASE_FILES: https://github.com/lychee-keyboard/lychee/releases/download/packs
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends librime-bin zip || \
            sudo apt-get install -y -q --no-install-recommends librime-bin zip
          pip install --quiet fonttools pillow

      # the sources are fetched afresh each week (the cache only saves refetching within a week)
      - name: Week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: |
            packs/ja/.cache
            packs/dict/.cache
          key: lychee-pack-sources-${{ steps.week.outputs.week }}

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: lychee-handwriting
          path: out/packs

      - name: Japanese dictionary pack
        run: python3 packs/ja/build_ja.py --out out/packs

      - name: Korean dictionary, stroke order and example sentence packs
        run: python3 packs/dict/build_dicts.py --out out/packs

      - name: Font and emoji packs (one-tap mirrors of the fonts' latest releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 packs/fonts/mirror_fonts.py --out out/packs

      # what changed since the published packs: new versions, and the manifest
      - name: Version the changed packs
        run: |
          curl -fsSL -o out/previous-manifest.json "$RELEASE_FILES/manifest.json" || echo "no published manifest yet"
          python3 packs/publish.py --packs out/packs --previous out/previous-manifest.json \
            --upload out/upload --manifest out/site/manifest.json

      - name: The packs page
        run: |
          app/scripts/fetch-fonts.sh
          cp packs/site/index.html out/site/
          cp app/data/out/assets/lychee/GoogleSansFlex.ttf out/site/
          printf 'Google Sans Flex, SIL Open Font License 1.1 (https://openfontlicense.org).\n' > out/site/FONT-LICENSE.txt
          touch out/site/.nojekyll

      - uses: actions/upload-artifact@v4
        with:
          name: lychee-packs
          # emoji fonts (Noto 3D is 140 MB) stay out: Actions storage is limited, and they are
          # on the packs release anyway
          path: |
            out/packs/lychee-*.zip
            !out/packs/lychee-emoji-*.zip
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: lychee-packs-page
          path: out/site
          retention-days: 7

      # what is published, file by file
      - name: List the packs' contents
        run: |
          for z in out/upload/lychee-*.zip; do
            [ -e "$z" ] || { echo "no pack changed"; break; }
            echo "== $z"; unzip -l "$z" | tail -n +4 | head -n -2 | awk '{print $4}' | head -20
          done

      # Public: the changed packs and manifest.json go to the "packs" release of
      # lychee-keyboard/lychee (a pre-release, so it never shows as the app's latest release),
      # uploaded with lychee-keyboard's token (the PACKS_TOKEN secret), so they appear as its own.
      # Only pack zips and the manifest go there. Runs on main only.
      - name: Publish to lychee's "packs" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.PACKS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::PACKS_TOKEN is not set; the packs were built but not published"
            exit 0
          fi
          if ! gh release view packs --repo "$REPO" >/dev/null 2>&1; then
            gh release create packs --repo "$REPO" --prerelease --title "Lychee packs" \
              --notes "Optional downloads for the Lychee keyboard: handwriting, dictionaries and fonts. In Lychee, open Settings > Downloads and tap Download; when your browser has saved the file, tap Open. All packs are free and openly licensed; each zip includes its licence."
          fi
          shopt -s nullglob
          zips=(out/upload/lychee-*.zip)
          if [ ${#zips[@]} -gt 0 ]; then
            gh release upload packs "${zips[@]}" --repo "$REPO" --clobber
          fi
          gh release upload packs out/site/manifest.json --repo "$REPO" --clobber

      # The packs page (index.html, manifest.json, its font) at https://lychee-keyboard.github.io/:
      # the main branch of lychee-keyboard/lychee-keyboard.github.io, which GitHub Pages serves.
      # The packs repository's own page (/lychee/, where earlier builds look) forwards there.
      - name: Publish the packs page
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.PACKS_TOKEN }}
          SITE_REPO: lychee-keyboard/lychee-keyboard.github.io
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::PACKS_TOKEN is not set; the page was not published"
            exit 0
          fi
          publish() {  # folder, repository, branch
            (cd "$1" && git init -q -b "$3" && git config user.name "Lychee packs" &&
             git config user.email "noreply@users.noreply.github.com" && git add -A &&
             git commit -q -m "Lychee packs page" &&
             git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/$2.git" "$3")
          }
          publish out/site "$SITE_REPO" main
          mkdir -p out/forward
          cp packs/site/forward.html out/forward/index.html
          touch out/forward/.nojekyll
          publish out/forward "$REPO" gh-pages
