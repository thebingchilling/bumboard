name: Screens

# Screenshots of Lychee's screens on an emulator (Settings > Add-ons, the dictionary card), for
# reviewing the UI. By hand only; builds nothing: it installs the newest debug release's APK.
# The screenshots are a small artifact kept for one day.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release tag to capture (empty: the newest)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: The release's APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.release }}"
          if [ -z "$tag" ]; then tag=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName'); fi
          echo "capturing $tag"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern lychee-universal.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Android 13's x86_64 image runs Lychee's ARM libraries through its ARM translation
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 6144M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/screens/capture.sh
      - uses: actions/upload-artifact@v4
        with:
          name: screens
          path: |
            screens/*.png
            screens/*.txt
          retention-days: 1
