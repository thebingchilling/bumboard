# Cantonese, typed in Yale (numbered tones optional). Same dictionary as lychee_yue;
# the speller rewrites every Jyutping syllable into its Yale spelling.
schema:
  schema_id: lychee_yue_yale
  name: 粵語 (Yale)
  version: "1"
  description: Cantonese (Yale input)

switches:
  - name: ascii_mode
    reset: 0
    states: [ 粵, A ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: simplification
    states: [ 繁, 简 ]

engine:
  __include: lychee_common:/chinese_engine

speller:
  # tone digits may follow a syllable; a composition must start with a letter
  alphabet: zyxwvutsrqponmlkjihgfedcba123456
  initials: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    # Jyutping -> Yale (numbered)
    - xform/^jyu/yu/
    - xform/^j/y/
    - xform/^z/j/
    - xform/^c/ch/
    - xform/eoi/eui/
    - xform/eo/eu/
    - xform/oe/eu/
    - xform/aa(?=\d)/a/
    # Yale writes low tones (4, 5, 6) with an h after the vowels: yuht, nàh -> nah
    - derive/^(m|ng)([456])$/$1h$2/
    - derive/^((?:ng|gw|kw|ch|[bpmfdtnlgkhwjsy])?[aeiou]+)([mnptk]|ng)?([456])$/$1h$2$3/
    # typing aids
    - derive/^ng(?=[aeiou])//
    - derive/\d//
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^(ch).+$/$1/

translator:
  dictionary: lychee_yue
  prism: lychee_yue_yale
  spelling_hints: 16
  always_show_comments: true

simplifier:
  option_name: simplification
  opencc_config: t2s.json
  tips: none

punctuator:
  __include: lychee_common:/punctuator
key_binder:
  __include: lychee_common:/key_binder
recognizer:
  __include: lychee_common:/recognizer

# the user's own words, written by Lychee's Personal dictionary page into Rime's user folder
custom_phrase:
  dictionary: ""
  user_dict: lychee_phrases_yue
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 1

# words going on from the syllables typed (中国 for "zhong"), ranked with the characters;
# the table and prism are built by build_data.py with this schema's spellings
phrase_completion:
  dictionary: lychee_yue_phrases
  prism: lychee_yue_yale_phrases
  enable_completion: false
  enable_sentence: false
  enable_user_dict: false
  enable_encoder: false
  initial_quality: 0
