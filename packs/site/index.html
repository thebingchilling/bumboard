<style>
  /* Material 3: a tonal palette from the accent (Lychee's, or the phone's when opened from it) */
  @font-face { font-family: "Google Sans Flex"; src: url("GoogleSansFlex.ttf") format("truetype"); font-weight: 100 1000; }
  :root {
    --accent: #006a5d;
    --primary: var(--accent);
    --on-primary: #ffffff;
    --background: color-mix(in srgb, var(--accent) 5%, #fbfdfb);
    --container: color-mix(in srgb, var(--accent) 9%, #f3f6f4);
    --tonal: color-mix(in srgb, var(--accent) 18%, #e8eeeb);
    --on-surface: #191c1b;
    --on-surface-variant: #3f4946;
    --outline: color-mix(in srgb, var(--accent) 12%, #c3cbc8);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --primary: color-mix(in srgb, var(--accent) 45%, #ffffff);
      --on-primary: color-mix(in srgb, var(--accent) 70%, #000000);
      --background: color-mix(in srgb, var(--accent) 6%, #111413);
      --container: color-mix(in srgb, var(--accent) 12%, #1d2120);
      --tonal: color-mix(in srgb, var(--accent) 28%, #252a28);
      --on-surface: #e1e3e2;
      --on-surface-variant: #bec9c5;
      --outline: color-mix(in srgb, var(--accent) 20%, #3a403e);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Google Sans Flex", system-ui, sans-serif;
    background: var(--background); color: var(--on-surface);
    display: grid; place-items: center; min-height: 100vh; padding: 24px 16px;
  }
  .card {
    width: 100%; max-width: 480px; padding: 28px 24px 20px;
    background: var(--container); border-radius: 28px;
  }
  h1 { margin: 0 0 6px; font-size: 24px; font-weight: 500; }
  h2 { margin: 20px 0 4px; font-size: 14px; font-weight: 600; color: var(--primary); }
  p { margin: 0; font-size: 15px; line-height: 1.45; color: var(--on-surface-variant); }
  ul { list-style: none; padding: 0; margin: 8px 0 0; }
  li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--outline); }
  li:first-child { border-top: 0; }
  .what { flex: 1; min-width: 0; }
  .name { font-size: 16px; }
  .meta { font-size: 13px; color: var(--on-surface-variant); margin-top: 2px; }
  .meta.new { color: var(--primary); font-weight: 500; }
  .button {
    font: inherit; font-size: 14px; font-weight: 500; letter-spacing: .1px; white-space: nowrap;
    background: var(--primary); color: var(--on-primary); border: 0; border-radius: 20px;
    padding: 10px 24px; text-decoration: none; cursor: pointer; display: inline-block; text-align: center;
  }
  .button.tonal { background: var(--tonal); color: var(--on-surface); padding: 8px 16px; }
  .button.big { display: block; width: 100%; margin-top: 20px; padding: 14px 24px; font-size: 16px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main class="card">
  <h1 id="title">Checking for updates…</h1>
  <p id="text">Comparing your Lychee add-ons with the newest versions.</p>
  <div id="lists"></div>
  <a class="button big hidden" id="back">Back to Lychee</a>
</main>
<script>
(() => {
  const params = new URLSearchParams(location.hash.slice(1));
  const app = /^[\w.]+$/.test(params.get('app') || '') ? params.get('app') : 'app.lychee';
  const accent = params.get('accent');
  if (/^[0-9a-f]{6}$/i.test(accent || '')) document.documentElement.style.setProperty('--accent', '#' + accent);
  // id:version pairs; versions may hold any character, so split on the first ':'
  const have = new Map();
  (params.get('have') || '').split(',').filter(Boolean).forEach((item) => {
    const i = item.indexOf(':');
    if (i > 0) have.set(item.slice(0, i), item.slice(i + 1));
  });
  // "All add-ons": every add-on, installed or not, stays on screen; a check goes straight back
  const all = params.get('all') === '1';
  const $ = (id) => document.getElementById(id);
  const say = (title, text) => { $('title').textContent = title; $('text').textContent = text; };

  // where each version's own file is: "lychee-korean-dictionary-2026.11.18.2.zip"
  const FILES = 'https://github.com/lychee-keyboard/lychee/releases/download/packs/';
  const fileOf = (p) => p.download_file ? FILES + encodeURIComponent(p.download_file) : (p.download || p.url);

  // Download in Lychee (get=id): straight on to the newest version's file, named with its
  // version, so the download says which version it is
  const get = params.get('get');
  if (get) {
    say('Downloading…', 'Getting the newest version.');
    fetch('manifest.json', { cache: 'no-store' })
      .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then((manifest) => {
        const p = (manifest.packs || {})[get];
        if (!p) throw new Error('unknown');
        say('Downloading ' + p.name, (p.download_file || '') + ' · ' + p.version +
          '. When it is done, go back to Lychee and choose the file.');
        location.href = fileOf(p);
      })
      .catch(() => say("Couldn't download", "The add-ons list didn't load. Check your connection and try again."));
    return;
  }

  // opened by itself, not from Lychee: what this page is for
  if (!params.has('have') && !all) {
    say('Lychee add-ons', 'In Lychee, open Settings › Add-ons and tap Updates: this page checks your add-ons and takes you back.');
    return;
  }

  // lychee://updates through Chrome's intent: links, which open Lychee itself: the newest
  // versions, and the file each is downloaded as
  const back = (latest, files) => 'intent://updates?latest=' + encodeURIComponent(latest) +
    '&files=' + encodeURIComponent(files) + '#Intent;scheme=lychee;package=' + app + ';end';
  const showBack = (url) => { const a = $('back'); a.href = url; a.classList.remove('hidden'); };
  const size = (b) => b >= 1 << 20 ? (b / (1 << 20)).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';

  const list = (title, ids, packs, row) => {
    if (ids.length === 0) return;
    const h = document.createElement('h2');
    h.textContent = title;
    const ul = document.createElement('ul');
    ids.forEach((id) => ul.append(row(id, packs[id])));
    $('lists').append(h, ul);
  };
  const item = (p, meta, isNew, link) => {
    const li = document.createElement('li');
    const what = document.createElement('div');
    what.className = 'what';
    const n = document.createElement('div');
    n.className = 'name';
    n.textContent = p.name;
    const m = document.createElement('div');
    m.className = 'meta' + (isNew ? ' new' : '');
    m.textContent = meta;
    what.append(n, m);
    li.append(what);
    if (link) {
      const a = document.createElement('a');
      a.className = 'button tonal';
      a.href = fileOf(p);
      a.textContent = link;
      li.append(a);
    }
    return li;
  };

  fetch('manifest.json', { cache: 'no-store' })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((manifest) => {
      const packs = manifest.packs || {};
      const ids = Object.keys(packs).sort((a, b) => packs[a].name.localeCompare(packs[b].name));
      const installed = ids.filter((id) => have.has(id));
      // a version recorded as the same contents ("same_as": relabelled with its source's own
      // version) is up to date: hand back the installed one, so Lychee shows no update
      const current = (id) => ((packs[id].same_as || []).includes(have.get(id)) ? have.get(id) : packs[id].version);
      const updates = installed.filter((id) => current(id) !== have.get(id));
      const latest = installed.map((id) => id + ':' + current(id)).join(',');
      const files = ids.filter((id) => packs[id].download_file).map((id) => id + ':' + packs[id].download_file).join(',');
      const url = back(latest, files);
      if (all) {
        say('Lychee add-ons', 'Every add-on, with what is on your phone. Downloaded files install when you choose them in Lychee.');
        list('Updates', updates, packs, (id, p) => item(p, 'Update: ' + have.get(id) + ' → ' + p.version, true, 'Download'));
        list('Installed', installed.filter((id) => !updates.includes(id)), packs, (id, p) => item(p, 'Installed · ' + current(id), false, null));
        list('Not installed', ids.filter((id) => !have.has(id)), packs, (id, p) => item(p, size(p.size) + ' · ' + p.version, false, 'Download'));
        showBack(url);
        return;
      }
      if (updates.length === 0) {
        say('All up to date', 'Your add-ons are the newest versions. Taking you back to Lychee…');
      } else {
        say('Update found', 'Taking you back to Lychee to download it.');
        list('Updates', updates, packs, (id, p) => item(p, p.version, true, null));
      }
      showBack(url);
      setTimeout(() => { location.href = url; }, 1200);
    })
    .catch(() => say("Couldn't check", "The add-ons list didn't load. Check your connection and try again."));
})();
</script>
</body>
</html>
