# Japanese, typed in romaji (Hepburn or Kunrei spellings). Dictionary: Mozc's open-source
# dictionary (BSD-3-Clause; IPAdic licence), shipped as Lychee's "Japanese dictionary" pack.
schema:
  schema_id: lychee_ja
  name: 日本語
  version: "1"
  description: Japanese (romaji input)

switches:
  - name: ascii_mode
    reset: 0
    states: [ あ, A ]
  - name: full_shape
    states: [ 半角, 全角 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - table_translator@custom_phrase
  filters:
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba-
  delimiter: " '"
  algebra:
    # Kunrei and other common spellings of the Hepburn syllables in the dictionary
    - derive/shi$/si/
    - derive/chi$/ti/
    - derive/tsu$/tu/
    - derive/fu$/hu/
    - derive/ji$/zi/
    - derive/sh([aueo])$/sy$1/
    - derive/ch([aueo])$/ty$1/
    - derive/ch([aueo])$/cy$1/
    - derive/j([aueo])$/zy$1/
    - derive/j([aueo])$/jy$1/
    - derive/^n$/nn/
    - derive/^tch/cch/
    - derive/^wo$/o/
    # short typing: first letters only (Chinese has it too: zg is 中国)
    - abbrev/^([a-z]).+$/$1/

translator:
  dictionary: lychee_ja
  prism: lychee_ja
  enable_sentence: true
  enable_user_dict: true
  # the romaji under every candidate, as a learning aid
  spelling_hints: 8

punctuator:
  half_shape:
    ",": { commit: "、" }
    ".": { commit: "。" }
    "?": { commit: "？" }
    "!": { commit: "！" }
    "[": { commit: "「" }
    "]": { commit: "」" }
    "{": { commit: "『" }
    "}": { commit: "』" }
    "~": { commit: "〜" }
    "/": "・"
  full_shape:
    ",": { commit: "、" }
    ".": { commit: "。" }

key_binder:
  __include: lychee_common:/key_binder
recognizer:
  __include: lychee_common:/recognizer

# the user's own words, written by Lychee's Personal dictionary page into Rime's user folder
custom_phrase:
  dictionary: ""
  user_dict: lychee_phrases_ja
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 1
