# Pieces shared by Lychee's schemas (included with __include).

chinese_engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    # the user's own words (Settings > Personal dictionary)
    - table_translator@custom_phrase
  filters:
    - simplifier
    - uniquifier

english_lookup_engine:
  processors:
    - ascii_composer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
  filters:
    - simplifier
    - uniquifier

key_binder:
  bindings:
    - { when: has_menu, accept: Page_Up, send: Page_Up }
    - { when: has_menu, accept: Page_Down, send: Page_Down }

recognizer:
  patterns: {}

punctuator:
  full_shape:
    " ": { commit: "　" }
    ",": { commit: "，" }
    ".": { commit: "。" }
    "<": [ "《", "〈", "«" ]
    ">": [ "》", "〉", "»" ]
    "/": [ "／", "÷" ]
    "?": { commit: "？" }
    ";": { commit: "；" }
    ":": { commit: "：" }
    "'": { pair: [ "‘", "’" ] }
    "\"": { pair: [ "“", "”" ] }
    "\\": [ "、", "＼" ]
    "|": [ "·", "｜" ]
    "`": "｀"
    "~": "～"
    "!": { commit: "！" }
    "@": "＠"
    "#": "＃"
    "%": "％"
    "$": [ "＄", "¥", "€", "£" ]
    "^": { commit: "……" }
    "&": "＆"
    "*": "＊"
    "(": "（"
    ")": "）"
    "-": "－"
    "_": "——"
    "+": "＋"
    "=": "＝"
    "[": [ "「", "【", "〔", "［" ]
    "]": [ "」", "】", "〕", "］" ]
    "{": [ "『", "〖", "｛" ]
    "}": [ "』", "〗", "｝" ]
  half_shape:
    ",": { commit: "，" }
    ".": { commit: "。" }
    "<": [ "《", "〈", "«", "<" ]
    ">": [ "》", "〉", "»", ">" ]
    "/": [ "/", "／", "÷" ]
    "?": { commit: "？" }
    ";": { commit: "；" }
    ":": { commit: "：" }
    "'": { pair: [ "‘", "’" ] }
    "\"": { pair: [ "“", "”" ] }
    "\\": [ "、", "\\" ]
    "|": [ "·", "|" ]
    "`": "`"
    "~": "～"
    "!": { commit: "！" }
    "@": "@"
    "#": "#"
    "%": "%"
    "$": [ "$", "¥", "€", "£" ]
    "^": { commit: "……" }
    "&": "&"
    "*": "*"
    "(": "（"
    ")": "）"
    "-": "-"
    "_": "——"
    "+": "+"
    "=": "="
    "[": [ "「", "【", "〔", "[" ]
    "]": [ "」", "】", "〕", "]" ]
    "{": [ "『", "〖", "{" ]
    "}": [ "』", "〗", "}" ]
