# Mandarin, typed in pinyin (ü as v). Dictionary text is Simplified;
# the traditionalization switch converts to Traditional with OpenCC.
schema:
  schema_id: lychee_cmn
  name: 普通话
  version: "1"
  description: Mandarin (pinyin input)

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中, A ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: traditionalization
    states: [ 简, 繁 ]

engine:
  __include: lychee_common:/chinese_engine

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba12345
  delimiter: " '"
  algebra:
    # codes carry their tone (ni3); typing it is optional
    - erase/^xx\d?$/
    - derive/\d$//
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    - derive/^([nl])ve$/$1ue/
    - derive/^([jqxy])u/$1v/
    - derive/un$/uen/
    - derive/ui$/uei/
    - derive/iu$/iou/
    - derive/([aeiou])ng$/$1gn/

translator:
  dictionary: lychee_cmn
  prism: lychee_cmn
  spelling_hints: 16
  always_show_comments: true
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

simplifier:
  option_name: traditionalization
  opencc_config: s2t.json
  tips: none

punctuator:
  __include: lychee_common:/punctuator
key_binder:
  __include: lychee_common:/key_binder
recognizer:
  __include: lychee_common:/recognizer

# the user's own words, written by Lychee's Personal dictionary page into Rime's user folder
custom_phrase:
  dictionary: ""
  user_dict: lychee_phrases_cmn
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 1

# words going on from the syllables typed (中国 for "zhong"), ranked with the characters;
# the table and prism are built by build_data.py with this schema's spellings
phrase_completion:
  dictionary: lychee_cmn_phrases
  prism: lychee_cmn_phrases
  enable_completion: false
  enable_sentence: false
  enable_user_dict: false
  enable_encoder: false
  initial_quality: 0
