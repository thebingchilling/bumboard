# Cantonese, typed in Jyutping. Dictionary: rime-cantonese (CC BY 4.0).
# The candidate comment carries the Jyutping of each candidate (spelling_hints);
# Lychee reads it to pick the right reading and meaning, and never shows it raw.
schema:
  schema_id: lychee_yue
  name: 粵語
  version: "1"
  description: Cantonese (Jyutping input)

switches:
  - name: ascii_mode
    reset: 0
    states: [ 粵, A ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: simplification
    states: [ 繁, 简 ]

engine:
  __include: lychee_common:/chinese_engine

speller:
  # tone digits may follow a syllable; a composition must start with a letter
  alphabet: zyxwvutsrqponmlkjihgfedcba123456
  initials: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    - derive/^([aeiou])/q$1/
    - derive/^jy?([aeiou])/y$1/
    - derive/^jyu/ju/
    - derive/yu(?!ng|k)/y/
    - derive/(g|k)u(?!ng|k)/$1wu/
    - derive/eoi(?=\d)/eoy/
    - derive/eo/oe/
    - derive/oe/eo/
    - derive/aa(?=\d)/a/
    - derive/\d//
    - abbrev/^([a-z]).+$/$1/

translator:
  dictionary: lychee_yue
  prism: lychee_yue
  spelling_hints: 16
  always_show_comments: true

simplifier:
  option_name: simplification
  opencc_config: t2s.json
  tips: none

punctuator:
  __include: lychee_common:/punctuator
key_binder:
  __include: lychee_common:/key_binder
recognizer:
  __include: lychee_common:/recognizer

# the user's own words, written by Lychee's Personal dictionary page into Rime's user folder
custom_phrase:
  dictionary: ""
  user_dict: lychee_phrases_yue
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 1

# words going on from the syllables typed (中国 for "zhong"), ranked with the characters;
# the table and prism are built by build_data.py with this schema's spellings
phrase_completion:
  dictionary: lychee_yue_phrases
  prism: lychee_yue_phrases
  enable_completion: false
  enable_sentence: false
  enable_user_dict: false
  enable_encoder: false
  initial_quality: 0
