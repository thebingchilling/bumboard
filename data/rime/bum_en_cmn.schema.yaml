# Type an English word, get Mandarin words that mean it.
schema:
  schema_id: bum_en_cmn
  name: 英→普
  version: "1"
  description: English to Mandarin lookup

switches:
  - name: ascii_mode
    reset: 0
    states: [ 英→普, A ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: traditionalization
    states: [ 简, 繁 ]

engine:
  __include: bum_common:/english_lookup_engine

speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " "

translator:
  dictionary: bum_en_cmn
  enable_completion: true
  enable_sentence: false
  enable_user_dict: false
  enable_encoder: false
  comment_format:
    - xform/^~.*$//

simplifier:
  option_name: traditionalization
  opencc_config: s2t.json
  tips: none

punctuator:
  __include: bum_common:/punctuator
key_binder:
  __include: bum_common:/key_binder
